<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Inventory UAS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/vue-router@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
        .active-link {
            background-color: white;
            color: #7240a1;
            font-weight: bold;
            border-radius: 0.5rem;
        }
        .sidebar-link {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 1rem;
            color: white;
            transition: all 0.2s;
            border-radius: 0.5rem;
            margin-bottom: 0.5rem;
        }
        .sidebar-link:hover:not(.active-link) {
            background-color: rgba(255, 255, 255, 0.1);
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-50 font-sans text-gray-800 antialiased overflow-hidden">
    <div id="app" class="flex h-screen w-full">
        <!-- Sidebar -->
        <aside v-if="isLoggedIn" class="w-64 bg-[#7240a1] text-white flex flex-col justify-between flex-shrink-0">
            <div>
                <!-- Top Nav / Brand inside Sidebar -->
                <div class="flex items-center p-6 h-16 bg-white w-full">
                    <span class="font-bold text-[#1f2937] text-xl tracking-wider flex items-center gap-2">
                        <span class="text-2xl">📦</span> E-INVENTORY
                    </span>
                </div>

                <nav class="mt-6 px-4">
                    <router-link to="/dashboard" class="sidebar-link" active-class="active-link">
                        <span>📦</span> Data Barang
                    </router-link>
                    <router-link to="/kategori" class="sidebar-link" active-class="active-link">
                        <span>🏷️</span> Kategori
                    </router-link>
                    <router-link to="/supplier" class="sidebar-link" active-class="active-link">
                        <span>🏢</span> Supplier
                    </router-link>
                    <router-link to="/histori" class="sidebar-link" active-class="active-link">
                        <span>🕒</span> Histori
                    </router-link>
                    <router-link to="/about" class="sidebar-link" active-class="active-link">
                        <span>ℹ️</span> About
                    </router-link>
                </nav>
            </div>
            
            <div class="p-4 mb-4">
                <button @click="logout" class="w-full bg-[#ef4444] text-white px-4 py-3 rounded-md font-bold shadow hover:bg-red-600 transition flex items-center justify-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M3 3a1 1 0 00-1 1v12a1 1 0 102 0V4a1 1 0 00-1-1zm10.293 9.293a1 1 0 001.414 1.414l3-3a1 1 0 000-1.414l-3-3a1 1 0 10-1.414 1.414L14.586 9H7a1 1 0 100 2h7.586l-1.293 1.293z" clip-rule="evenodd" />
                    </svg>
                    Logout Akun
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 overflow-y-auto" :class="isLoggedIn ? 'bg-[#e2d5ed]' : 'bg-gray-50'">
            <div v-if="isLoggedIn" class="bg-white h-16 w-full shadow-sm flex items-center justify-between px-6">
                 <!-- Header topbar placeholder if needed -->
                 <div class="text-gray-500">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                    </svg>
                 </div>
                 <div>
                    <span class="font-bold text-[#1f2937] text-xl tracking-wider flex items-center gap-2">
                        <span class="text-2xl">📦</span> E-INVENTORY
                    </span>
                 </div>
            </div>
            
            <div :class="isLoggedIn ? 'p-6' : 'p-0'">
                <router-view></router-view>
            </div>
        </main>
    </div>

    <script src="assets/js/components/Login.js"></script>
    <script src="assets/js/components/Dashboard.js"></script>
    <script src="assets/js/components/Kategori.js"></script>
    <script src="assets/js/components/Supplier.js"></script>
    <script src="assets/js/components/Histori.js"></script>
    <script src="assets/js/components/About.js"></script>
    <script src="assets/js/app.js"></script>
</body>
</html>
